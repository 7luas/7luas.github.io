<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Portfolio</title>
  <!-- Load Roboto light font from Google Fonts -->
  <link href="https://fonts.googleapis.com/css?family=Roboto:300&display=swap" rel="stylesheet">
  <style>
    /* Global Styles */
    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background: #fff;
      color: #333;
    }
    h1, h2, h3, p {
      margin: 0;
      padding: 0;
    }
    /* Header */
    header {
      text-align: center;
      font-size: 1.5em;
      padding: 20px 10px;
    }
    /* Filter Buttons */
    #filter-buttons {
      text-align: center;
      padding: 10px 0;
    }
    .filter-btn {
      display: inline-block;
      font-size: 0.8em;
      text-transform: uppercase;
      padding: 5px 10px;
      margin: 0 5px;
      border: none;
      cursor: pointer;
      transition: filter 0.2s ease;
      border-radius: 3px;
    }
    /* Active: blue background, Inactive: grey background */
    .active {
      background-color: #007BFF;
      color: #fff;
    }
    .inactive {
      background-color: #888;
      color: #fff;
    }
    /* Hover: 10% darker */
    .filter-btn:hover {
      filter: brightness(90%);
    }
    /* Click flash: 10% lighter (applied via JS) */
    .flash {
      filter: brightness(110%);
    }
    /* Project Count */
    #project-count {
      text-align: center;
      font-size: 0.7em;
      padding-bottom: 10px;
    }
    /* Project Grid */
    #project-grid {
      display: grid;
      grid-gap: 0;
      margin: 0 auto;
      /* Default: 1 column; media queries below will adjust */
      grid-template-columns: repeat(1, 1fr);
    }
    /* Project Tile */
    .project-tile {
      position: relative;
      width: 100%;
      max-width: 800px;
      height: 0;
      padding-bottom: 56.25%; /* 16:9 aspect ratio fallback */
      overflow: hidden;
      transition: transform 0.3s ease-in;
    }
    /* Ensure all direct children fill the tile */
    .project-tile > * {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    /* Main Media styling */
    .project-tile img,
    .project-tile video {
      object-fit: cover;
      transition: filter 0.3s ease-in;
      display: block;
    }
    /* Overlay (hidden by default) */
    .tile-overlay {
      background: rgba(0, 0, 0, 0.3);
      color: #fff;
      opacity: 0;
      transition: opacity 0.3s ease-in;
      padding: 10px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      font-size: 0.8em;
    }
    /* When hovered, show overlay */
    .project-tile.hovered .tile-overlay {
      opacity: 1;
    }
    /* Featured indicator (small orange circle at top-right) */
    .featured-indicator {
      top: 5px;
      right: 5px;
      width: 12px;
      height: 12px;
      background: orange;
      border-radius: 50%;
      z-index: 2;
    }
    /* Tags in overlay (styled as pills) */
    .overlay-tags {
      margin-top: 5px;
    }
    .overlay-tags span {
      background: rgba(255,255,255,0.3);
      padding: 2px 6px;
      border-radius: 10px;
      margin-right: 4px;
      font-size: 0.7em;
    }
    /* Responsive grid columns */
    @media (min-width: 600px) {
      #project-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    @media (min-width: 900px) {
      #project-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }
    @media (min-width: 1400px) {
      #project-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
</head>
<body>
  <!-- Header -->

    <button id="btn-featured" class="filter-btn inactive">FEATURED</button>
    <!-- Tag buttons will be generated dynamically -->

  </div>
  <!-- Project Count -->
  <div id="project-count">Showing 0 projects</div>
  <!-- Project Grid -->
  <div id="project-grid"></div>
  <!-- Footer -->
  <footer style="text-align:center; font-size:0.7em; color: grey; padding: 20px 0;">

        ],

      },
      {
        name: "Project Eight",
        shortDescription: "Fusce rutrum est et sem viverra, ac tincidunt mauris sagittis. Praesent non orci vel nunc cursus mollis. Donec porta magna id felis porttitor, non vestibulum dolor feugiat.",

        ],

        featured: false
      },
      {
        name: "Project Nine",
        shortDescription: "Curabitur suscipit libero id arcu lacinia, non sollicitudin purus facilisis. Donec ullamcorper, turpis in aliquet sagittis, tortor sem volutpat sapien, in molestie risus lorem sed urna.",
        mainMedia: "https://www.7luas.com.br/images/exhibit1.jpg",
        content: [
          "Praesent scelerisque velit nec.",
          "https://www.7luas.com.br/images/exhibit1.jpg",
          "Nullam at urna in.",
          "Sed viverra elit id."
        ],
        tags: ["tag1", "tag3", "tag2"],
        featured: false
      },
      {
        name: "Project Ten",
        shortDescription: "Etiam bibendum orci in justo dignissim, a ultrices mi interdum. Pellentesque vitae mauris ut erat malesuada pretium. Morbi vestibulum massa non tellus blandit, quis consectetur dui vestibulum.",
        mainMedia: "https://www.7luas.com.br/images/IcarusVidlo.mp4",
        content: [
          "In hac habitasse platea dictumst.",
          "https://www.7luas.com.br/images/IcarusVidlo.mp4",
          "Vestibulum consequat ante vitae."
        ],
        tags: ["tag2", "tag4"],
        featured: false
      }
    ];
    
    /*************** Filter State ***************/
    // State variables to track active filters.
    let activeFeatured = false;
    let activeTags = []; // array of tag strings
    // "ALL" is considered active when neither activeFeatured nor activeTags are set.
    
    /*************** DOM Elements ***************/
    const btnAll = document.getElementById("btn-all");
    const btnFeatured = document.getElementById("btn-featured");
    const tagButtonsContainer = document.getElementById("tag-buttons");
    const projectCountEl = document.getElementById("project-count");
    const projectGrid = document.getElementById("project-grid");
    
    /*************** Utility Functions ***************/
    // Count media items in the project's content array.
    function countMedia(contentArray) {
      // Consider an entry to be media if it exactly matches one of the two URLs.
      const mediaURLs = [
        "https://www.7luas.com.br/images/IcarusVidlo.mp4",
        "https://www.7luas.com.br/images/exhibit1.jpg"
      ];
      return contentArray.filter(item => mediaURLs.includes(item)).length;
    }
    
    // Generate unique tag list from projectsData.
    function getUniqueTags() {
      const tagSet = new Set();
      projectsData.forEach(proj => {
        proj.tags.forEach(tag => tagSet.add(tag));
      });
      return Array.from(tagSet);
    }
    
    // Update the display of the filter buttons based on active states.
    function updateFilterButtonsUI() {
      // ALL button: active if no other filter is active.
      if (!activeFeatured && activeTags.length === 0) {
        btnAll.classList.add("active");
        btnAll.classList.remove("inactive");
      } else {
        btnAll.classList.remove("active");
        btnAll.classList.add("inactive");
      }
      // FEATURED button:
      if (activeFeatured) {
        btnFeatured.classList.add("active");
        btnFeatured.classList.remove("inactive");
      } else {
        btnFeatured.classList.remove("active");
        btnFeatured.classList.add("inactive");
      }
      // Tag buttons:
      const allTagButtons = document.querySelectorAll(".tag-btn");
      allTagButtons.forEach(btn => {
        const tag = btn.getAttribute("data-tag");
        if (activeTags.includes(tag)) {
          btn.classList.add("active");
          btn.classList.remove("inactive");
        } else {
          btn.classList.remove("active");
          btn.classList.add("inactive");
        }
      });
    }
    
    // Update the project grid based on current filters.
    function renderProjects() {
      // Clear the grid.
      projectGrid.innerHTML = "";
      
      // Determine filtered projects.
      let filteredProjects = [];
      if (activeFeatured) {
        filteredProjects = projectsData.filter(proj => proj.featured);
      } else if (activeTags.length > 0) {
        filteredProjects = projectsData.filter(proj => {
          return proj.tags.some(tag => activeTags.includes(tag));
        });
      } else {
        filteredProjects = projectsData.slice(); // all projects
      }
      
      // Sort: featured projects on top.
      filteredProjects.sort((a, b) => (b.featured === a.featured) ? 0 : (b.featured ? 1 : -1));
      
      // Update project count text.
      projectCountEl.textContent = `Showing ${filteredProjects.length} project${filteredProjects.length === 1 ? "" : "s"}`;
      
      // Create and append each project tile.
      filteredProjects.forEach(proj => {
        const tile = document.createElement("div");
        tile.className = "project-tile";
        
        // Add featured indicator if needed.
        if (proj.featured) {
          const featIndicator = document.createElement("div");
          featIndicator.className = "featured-indicator";
          tile.appendChild(featIndicator);
        }
        
        // Create main media element.
        let mediaEl;
        if (proj.mainMedia.endsWith(".mp4")) {
          mediaEl = document.createElement("video");
          mediaEl.src = proj.mainMedia;
          mediaEl.autoplay = true;
          mediaEl.loop = true;
          mediaEl.muted = true;
          mediaEl.playsInline = true;
        } else {
          mediaEl = document.createElement("img");
          mediaEl.src = proj.mainMedia;
          mediaEl.alt = proj.name;
        }
        tile.appendChild(mediaEl);
        
        // Create overlay element (hidden by default)
        const overlay = document.createElement("div");
        overlay.className = "tile-overlay";
        // Project title with media count in brackets
        const titleEl = document.createElement("div");
        titleEl.innerHTML = `<strong>${proj.name}</strong> <small>[${countMedia(proj.content)}]</small>`;
        overlay.appendChild(titleEl);
        // Short description
        const descEl = document.createElement("div");
        descEl.textContent = proj.shortDescription;
        overlay.appendChild(descEl);
        // Tags as pills
        const tagsEl = document.createElement("div");
        tagsEl.className = "overlay-tags";
        proj.tags.forEach(tag => {
          const tagSpan = document.createElement("span");
          tagSpan.textContent = tag;
          tagsEl.appendChild(tagSpan);
        });
        overlay.appendChild(tagsEl);
        tile.appendChild(overlay);
        
        // Hover behavior: scale tile and adjust overlay.
        tile.addEventListener("mouseenter", () => {
          // Determine transform-origin based on tile's position relative to container edges.
          const tileRect = tile.getBoundingClientRect();
          const gridRect = projectGrid.getBoundingClientRect();
          let origin = "center center";
          if (Math.abs(tileRect.left - gridRect.left) < 5) {
            origin = "left center";
          } else if (Math.abs(tileRect.right - gridRect.right) < 5) {
            origin = "right center";
          }
          tile.style.transformOrigin = origin;
          tile.classList.add("hovered");
          tile.style.transform = "scale(1.2)";
          mediaEl.style.filter = "brightness(90%)";
        });
        tile.addEventListener("mouseleave", () => {
          tile.classList.remove("hovered");
          tile.style.transform = "scale(1)";
          mediaEl.style.filter = "brightness(100%)";
        });
        
        projectGrid.appendChild(tile);
      });
    }
    
    // Apply a temporary flash effect on a button (10% lighter) on click.
    function flashButton(btn) {
      btn.classList.add("flash");
      setTimeout(() => {
        btn.classList.remove("flash");
      }, 150);
    }
    
    /*************** Event Listeners for Filter Buttons ***************/
    // ALL button
    btnAll.addEventListener("click", () => {
      flashButton(btnAll);
      if (activeFeatured || activeTags.length > 0) {
        activeFeatured = false;
        activeTags = [];
      }
      updateFilterButtonsUI();
      renderProjects();
    });
    
    // FEATURED button
    btnFeatured.addEventListener("click", () => {
      flashButton(btnFeatured);
      if (!activeFeatured) {
        activeFeatured = true;
        activeTags = [];
      } else {
        activeFeatured = false;
      }
      updateFilterButtonsUI();
      renderProjects();
    });
    
    // Generate tag buttons dynamically.
    function generateTagButtons() {
      const uniqueTags = getUniqueTags();
      uniqueTags.forEach(tag => {
        const btn = document.createElement("button");
        btn.className = "filter-btn tag-btn inactive";
        btn.textContent = tag;
        btn.setAttribute("data-tag", tag);
        btn.addEventListener("click", () => {
          flashButton(btn);
          activeFeatured = false;
          const uniqueTagsAll = getUniqueTags();
          if (activeTags.includes(tag)) {
            activeTags = activeTags.filter(t => t !== tag);
          } else {
            let activeCount = activeTags.length;
            if (uniqueTagsAll.length - activeCount === 1) {
              activeTags = [];
            } else {
              activeTags.push(tag);
            }
          }
          updateFilterButtonsUI();
          renderProjects();
        });
        tagButtonsContainer.appendChild(btn);
      });
    }
    
    /*************** Initialization ***************/
    document.addEventListener("DOMContentLoaded", () => {
      generateTagButtons();
      updateFilterButtonsUI();
      renderProjects();
    });
  </script>
</body>
