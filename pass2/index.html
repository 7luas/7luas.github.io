<html>
	<head>
		<title>Title for this project (Template v0.2 2025/06/03)</title>
		<meta name="viewport" content="user-scalable=no,initial-scale=1,maximum-scale=1,minimum-scale=1,width=device-width">
		<meta name="robots" content="noindex">
		<script language="javascript" type="text/javascript" src="script.js"></script>
		<style>
			body {
				background-color:#000000; 
				width: 100%; 
				height: 100%; 
				margin: 0;
			}
			#everything {
				background-color:#FFFFFF; 
				width: 100%; 
				height: 100%;  
				margin:0; 
				position: relative;
			
			}
			
			#mainCanvas, #fakePixelsCanvas, #debugCanvas, #pointerCanvas {
				width: 100%;
				height: 100%;  
				margin:0; 
				touch-action: none; 
				position: absolute;
			}
			
			#fakePixelsCanvas {
				image-rendering: -moz-crisp-edges;
				image-rendering: -webkit-crisp-edges;
				image-rendering: pixelated;			
			}
			
		</style>
	</head>
	<body onload="onLoad();" onkeydown="onKeyDown(event)" onkeyup="onKeyUp(event);">


		<div id="everything">
			<canvas id="fakePixelsCanvas"></canvas>
			<canvas id="mainCanvas"></canvas>
			<canvas id="debugCanvas"></canvas>
			<canvas id="pointerCanvas"></canvas>
		</div>


	</body>
</html>
